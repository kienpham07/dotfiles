unbind r
bind r source-file ~/.tmux.conf

# Set custom prefix
set -g prefix C-s

# Vim-style pane selection
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set the position of bar
set-option -g status-position top

# CLose tmux session without exit tmux
set-option -g detach-on-destroy off

# Fix issue from window tiles
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# 1. Configure the Catppuccin plugin preferences
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# 2. Load the theme script manually so its components are available for status-right
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# 3. Configure the status line layout
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# 4. List of plugins managed by TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# 5. Initialize TMUX plugin manager (Keep this at the absolute bottom)
run '~/.tmux/plugins/tpm/tpm'

# 6. Style the command-prompt / message line (e.g. prefix + : rename-window)
# tmux 3.7 changed messages/prompts to only paint the text they need,
# overlaying the status line instead of replacing it, UNLESS the style
# includes "fill" — that's what was causing the overlap. See tmux CHANGES
# (3.6b -> 3.7): "The message-style option now need to include 'fill' in
# order to cover the whole width".
set -g message-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"
set -g message-command-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"

